events {}

http {
  # Docker's embedded DNS (127.0.0.11) with a short TTL, used instead of a
  # static `upstream {}` block. A static upstream resolves the hostname ONCE
  # at nginx startup/reload and then caches that IP forever — if `api` or
  # `web` gets recreated (a redeploy, a crash restart) without nginx also
  # restarting, nginx keeps proxying to the dead container's old IP and every
  # request 502s. Routing through a variable forces nginx to re-resolve on
  # this TTL instead.
  resolver 127.0.0.11 valid=10s;

  server {
    listen 80;
    client_max_body_size 30m;

    # Local storage bucket (README §6.3's S3 stand-in) — served straight off
    # the shared Docker volume the API writes into. nginx here stands in for
    # the CDN that would front real object storage.
    location /media/ {
      alias /media/;
    }

    # Strip the /api/ prefix — Express routes are mounted at the root path.
    # proxy_pass with NO URI component (just the scheme+host) forwards
    # whatever the request URI has been rewritten to, unchanged.
    location /api/ {
      # `set` must come BEFORE `rewrite ... break` — break halts further
      # rewrite-phase directives in this location, so a `set` written after
      # it would never actually run and the variable would stay empty.
      set $api_upstream api:8000;
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
    }

    location / {
      set $web_upstream web:3000;
      proxy_pass http://$web_upstream;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
