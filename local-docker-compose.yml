# Local dev topology: fully self-contained (its own Postgres/Redis/Kafka,
# plus pgAdmin/RedisInsight for poking at them), with every value hardcoded
# below — no .env file needed to run this at all. For the real VPS/Traefik
# deployment (shared Postgres/Redis, secrets required from .env), use
# docker-compose.yml instead.
#
#   docker compose -f local-docker-compose.yml up -d --build
#
# `web` is reachable directly AND through nginx at "/"; `api` has NO direct
# host port — it sits behind nginx's "/api" route only, same as it would
# behind a real gateway in prod. postgres/redis/kafka ARE exposed directly
# too (5432/6379/9092), purely so you can point psql/redis-cli/a Kafka
# client at them from your host while developing.
services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media-data:/media:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: api
    restart: unless-stopped
    environment:
      PORT: 8000
      LOG_LEVEL: info
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: feedapp
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /media
      JWT_SECRET: local-dev-only-secret-not-for-production
      JWT_EXPIRES_IN: 2h
    volumes:
      - media-data:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The outbox pattern's relay (README §6.1): turns pending outbox rows into
  # Kafka messages. Safe to run more than one replica (SELECT ... FOR UPDATE
  # SKIP LOCKED).
  outbox-poller:
    build:
      context: .
      dockerfile: backend/outbox-poller/Dockerfile
    container_name: outbox-poller
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: feedapp
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # The fan-out consumer (README §6.1/§6.2). Scale with:
  #   docker compose -f local-docker-compose.yml up -d --build --scale fanout-worker=3
  # — see README §7 "Fan-out backlog / latency spike". No container_name /
  # host port here on purpose, so scaling doesn't collide.
  fanout-worker:
    build:
      context: .
      dockerfile: backend/fanout-worker/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: info
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: app
      PGPASSWORD: app
      PGDATABASE: feedapp
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: feedapp
    ports:
      - "5432:5432"
    volumes:
      - ./pg/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d feedapp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    # Without AOF + a volume, Redis is pure in-memory: any process restart
    # (container restart, Docker daemon restart/crash) wipes every feed-list
    # and post-content cache entry. That's harmless on its own — it's a
    # cache, Postgres is the source of truth — EXCEPT Kafka durably commits
    # consumer offsets for "fanout-workers" independently, so after a wipe
    # the worker resumes past old post.created events instead of replaying
    # them, and those posts' fan-out is gone for good. Persisting Redis too
    # keeps both halves of the pipeline's state recoverable together.
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-broker Kafka in KRaft mode — no ZooKeeper needed for local dev.
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # Default log.dirs (/tmp/kraft-combined-logs) lives in the container's
    # writable layer, not a volume — topic data AND the durably-committed
    # consumer-group offsets it holds both vanish on anything that clears
    # that layer (e.g. a Docker Desktop VM reset), with no error to signal
    # it. Pinning a named volume here keeps the broker's own log survivable
    # across restarts, same as pg-data/redis-data.
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  # --- Admin/debug tools -----------------------------------------------
  # Exposed directly on their own host ports — these are operator tools, not
  # part of the app's request path, so they don't go through nginx.
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    restart: unless-stopped
    environment:
      RI_APP_PORT: 5540
    ports:
      - "5540:5540"
    volumes:
      - redisinsight-data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pg-data:
  pgadmin-data:
  redis-data:
  kafka-data:
  redisinsight-data:
  # The "local storage bucket" (README §6.3's S3 stand-in): a plain Docker
  # volume the API writes uploaded media into and nginx serves back out of
  # read-only at /media/* (nginx stands in for the CDN in front of it).
  #
  # NOTE: this replaces an earlier MinIO-based design — both minio/minio and
  # quay.io/minio/minio now refuse anonymous pulls (MinIO gated their public
  # container images), so a real S3-compatible server isn't freely runnable
  # here anymore. Swap this volume back for MinIO (or LocalStack) if you have
  # registry credentials and want real presigned-URL / multipart-upload
  # semantics — the API's media.ts module is the only place that would change.
  media-data:
