# Production/VPS topology. Deployed behind an existing Traefik instance,
# reusing shared Postgres + Redis that already run on `backend-net` for other
# apps on this box — this stack does NOT define postgres/redis services of
# its own. Kafka stays private to this stack (it's not shared with anything
# else on the box). For local development, use local-docker-compose.yml
# instead — it's self-contained (its own Postgres/Redis, hardcoded env, no
# .env needed).
#
# Every secret below is required via ${VAR:?...} — there's no safe default
# for credentials to infrastructure shared with other services, so compose
# refuses to start rather than silently reusing a wrong/guessable value.
# Copy .env.example to .env and fill it in before running this file.
#
#   docker compose up -d --build
#
services:
  nginx:
    image: nginx:alpine
    container_name: feed-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media-data:/media:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    networks: [feed]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.feed.rule=Host(`${DOMAIN:-feed.sanattudu.tech}`)"
      - "traefik.http.routers.feed.entrypoints=websecure"
      - "traefik.http.routers.feed.tls=true"
      - "traefik.http.routers.feed.tls.certresolver=letsencrypt"
      - "traefik.http.services.feed.loadbalancer.server.port=80"

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: feed-web
    restart: unless-stopped
    environment:
      HOSTNAME: "0.0.0.0" # avoids the Next.js standalone server's "connection refused" healthcheck issue
    depends_on:
      api:
        condition: service_healthy
    networks: [feed]

  api:
    build:
      context: .
      dockerfile: backend/api/Dockerfile
    container_name: feed-api
    restart: unless-stopped
    environment:
      PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PGHOST: postgres # the shared instance on backend-net, not a service in this file
      PGPORT: 5432
      PGUSER: ${FEED_DB_USER:?set FEED_DB_USER in .env}
      PGPASSWORD: ${FEED_DB_PASSWORD:?set FEED_DB_PASSWORD in .env}
      PGDATABASE: ${FEED_DB_NAME:?set FEED_DB_NAME in .env}
      REDIS_URL: ${FEED_REDIS_URL:?set FEED_REDIS_URL in .env — e.g. redis://redis:6379/1, a dedicated db index so keys don't collide with other apps on the shared instance}
      MEDIA_DIR: /media
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-2h}
    volumes:
      - media-data:/media
    networks: [feed, backend-net] # backend-net: reach the shared postgres/redis

  # Outbox relay: turns pending outbox rows into Kafka messages. Safe to run
  # more than one replica (SELECT ... FOR UPDATE SKIP LOCKED).
  outbox-poller:
    build:
      context: .
      dockerfile: backend/outbox-poller/Dockerfile
    container_name: feed-outbox-poller
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${FEED_DB_USER:?set FEED_DB_USER in .env}
      PGPASSWORD: ${FEED_DB_PASSWORD:?set FEED_DB_PASSWORD in .env}
      PGDATABASE: ${FEED_DB_NAME:?set FEED_DB_NAME in .env}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [feed, backend-net] # feed: reach kafka; backend-net: reach the shared postgres

  # Fan-out consumer. Scale with: docker compose up -d --build --scale fanout-worker=3
  fanout-worker:
    build:
      context: .
      dockerfile: backend/fanout-worker/Dockerfile
    restart: unless-stopped
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${FEED_DB_USER:?set FEED_DB_USER in .env}
      PGPASSWORD: ${FEED_DB_PASSWORD:?set FEED_DB_PASSWORD in .env}
      PGDATABASE: ${FEED_DB_NAME:?set FEED_DB_NAME in .env}
      REDIS_URL: ${FEED_REDIS_URL:?set FEED_REDIS_URL in .env}
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks: [feed, backend-net]

  # Single-broker Kafka in KRaft mode, private to this stack (unlike
  # Postgres/Redis, there's no existing shared broker on the box to reuse).
  kafka:
    image: apache/kafka:3.7.0
    container_name: feed-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m" # cap JVM memory on a shared VPS
    # Default log.dirs (/tmp/kraft-combined-logs) lives in the container's
    # writable layer, not a volume — topic data AND the durably-committed
    # consumer-group offsets it holds both vanish on anything that clears
    # that layer. Pinning a named volume keeps the broker survivable across
    # restarts/redeploys.
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks: [feed]

networks:
  feed: {} # intra-stack: nginx <-> web <-> api <-> outbox-poller/fanout-worker <-> kafka
  backend-net:
    external: true # the host's shared network carrying Postgres/Redis for all apps on the box

volumes:
  kafka-data:
  # The "local storage bucket" (README §6.3's S3 stand-in): a plain Docker
  # volume the API writes uploaded media into and nginx serves back out of
  # read-only at /media/* (nginx stands in for the CDN in front of it).
  media-data:
